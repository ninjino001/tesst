version: '3.9'

services:
  db:
    image: postgres:16
    container_name: aimos_db
    environment:
      POSTGRES_DB: aimosdb
      POSTGRES_USER: aimos
      POSTGRES_PASSWORD: aimos123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aimos_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: aimos.settings
      DB_HOST: db
      DB_NAME: aimosdb
      DB_USER: aimos
      DB_PASSWORD: aimos123
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aimos_frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aimos_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
